<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VoiceBridge — Real-time Translator</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06091a;--neon:#00d4ff;--teal:#06b6d4;--grn:#10b981;--red:#f43f5e;--txt:#eef4ff;--dim:#5a7a9a;--r:16px;--font:'Outfit',sans-serif}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);overflow:hidden}
canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(0,212,255,.022)1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.022)1px,transparent 1px);
  background-size:54px 54px;mask-image:radial-gradient(ellipse 80% 70% at 50% 30%,black,transparent 80%)}
nav{position:fixed;top:0;left:0;right:0;z-index:200;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(6,9,26,.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,212,255,.08)}
.nb{display:flex;align-items:center;gap:11px}
.nlogo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(124,58,237,.15));border:1px solid rgba(0,212,255,.25);display:flex;align-items:center;justify-content:center}
.mwrap{display:flex;align-items:center;gap:2px;height:14px}
.mw{width:2.5px;border-radius:2px;background:linear-gradient(to top,var(--neon),#a78bfa);animation:wa 1.4s ease-in-out infinite}
.mw:nth-child(1){height:4px}.mw:nth-child(2){height:10px;animation-delay:.12s}.mw:nth-child(3){height:14px;animation-delay:.24s}.mw:nth-child(4){height:8px;animation-delay:.36s}.mw:nth-child(5){height:11px;animation-delay:.18s}
@keyframes wa{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.6)}}
.ntitle{font-size:1.1rem;font-weight:800;letter-spacing:-.03em;background:linear-gradient(120deg,#fff,var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nr{display:flex;align-items:center;gap:12px}
.wspill{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:600;background:rgba(244,63,94,.1);border:1px solid rgba(244,63,94,.2);color:#f87171;transition:all .3s}
.wspill.on{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.2);color:#34d399}
.wsdot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.nusr{font-size:.8rem;font-weight:600;color:var(--dim);padding:4px 10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:7px}
.lout{padding:5px 14px;background:transparent;border:1px solid rgba(255,255,255,.08);border-radius:7px;color:var(--dim);font-size:.76rem;cursor:pointer;font-family:var(--font);transition:all .2s}
.lout:hover{border-color:var(--red);color:var(--red)}
main{position:relative;z-index:10;height:100vh;padding:74px 20px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;overflow-y:auto}
.lbar{display:flex;align-items:center;gap:10px;background:rgba(13,21,56,.82);backdrop-filter:blur(16px);border:1px solid rgba(0,212,255,.1);border-radius:13px;padding:13px 18px;width:100%;max-width:760px}
.lsw{display:flex;flex-direction:column;gap:5px;flex:1}
.lsw label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.lsw select{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.07);border-radius:9px;color:var(--txt);font-family:var(--font);font-size:.88rem;padding:9px 12px;outline:none;cursor:pointer;transition:border-color .2s}
.lsw select option{background:#0d1535}
.swap-btn{width:42px;height:42px;border-radius:12px;flex-shrink:0;margin-top:18px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);color:var(--neon);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;font-size:1.1rem}
.swap-btn:hover{background:rgba(0,212,255,.14);transform:rotate(180deg)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:960px}
@media(max-width:680px){.panels{grid-template-columns:1fr}}
.panel{background:rgba(10,16,40,.78);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.5);min-height:300px}
.panel-in.on{border-color:rgba(244,63,94,.5);box-shadow:0 0 0 2px rgba(244,63,94,.1),0 16px 48px rgba(0,0,0,.5)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px;border-bottom:1px solid rgba(255,255,255,.05)}
.ph-label{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--neon);display:flex;align-items:center;gap:6px}
.ph-dot{width:6px;height:6px;border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon)}
.viz{display:flex;align-items:flex-end;gap:2px;height:20px}
.vbar{width:3px;border-radius:2px;background:rgba(0,212,255,.2);height:3px;transition:height .06s}
.tbox{flex:1;padding:16px;font-size:.97rem;line-height:1.75;color:var(--txt);word-break:break-word;overflow-y:auto;max-height:200px}
.tbox::-webkit-scrollbar{width:3px}
.tbox::-webkit-scrollbar-thumb{background:rgba(0,212,255,.2);border-radius:2px}
.ph-txt{color:var(--dim);font-style:italic;font-size:.88rem}
.chunk{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);animation:fadeIn .3s ease}
.chunk:last-child{border-bottom:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chunk-src{font-size:.82rem;color:var(--dim);margin-bottom:2px}
.chunk-trl{font-size:.97rem;color:var(--txt);font-weight:500}
.panel-bottom{padding:14px 16px;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.mic-btn{position:relative;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#6d28d9);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;box-shadow:0 4px 28px rgba(14,165,233,.4);transition:all .25s;user-select:none}
.mic-btn:hover{transform:scale(1.05)}
.mic-btn.on{background:linear-gradient(135deg,#e11d48,#f97316);box-shadow:0 4px 32px rgba(225,29,72,.55);animation:rp 1.2s ease-in-out infinite}
@keyframes rp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.mic-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid transparent;opacity:0;animation:ro 1.8s ease-out infinite}
.mic-ring.r2{inset:-24px;animation-delay:-.9s}
.mic-btn.on .mic-ring{opacity:1;border-color:rgba(225,29,72,.3)}
@keyframes ro{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.mic-label{font-size:.8rem;font-weight:600;letter-spacing:.02em;transition:color .3s;color:var(--dim)}
.mic-label.on{color:var(--red)}
.out-btns{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.btn-replay{display:flex;align-items:center;gap:7px;padding:9px 18px;background:rgba(6,182,212,.08);border:1px solid rgba(6,182,212,.25);border-radius:9px;color:var(--teal);font-family:var(--font);font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-replay:hover:not(:disabled){background:rgba(6,182,212,.18)}
.btn-replay:disabled{opacity:.3;cursor:not-allowed}
.btn-clear{display:flex;align-items:center;gap:6px;padding:9px 14px;background:rgba(244,63,94,.06);border:1px solid rgba(244,63,94,.2);border-radius:9px;color:#f87171;font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-clear:hover{background:rgba(244,63,94,.12)}
.btn-copy{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.9rem;transition:all .2s}
.btn-copy:hover{border-color:var(--neon);color:var(--neon)}
.status-row{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--dim);width:100%;max-width:960px;padding:0 4px}
.ssp{width:13px;height:13px;border-radius:50%;border:2px solid rgba(0,212,255,.15);border-top-color:var(--neon);animation:spin .7s linear infinite;opacity:0;transition:opacity .3s;flex-shrink:0}
.ssp.on{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.hist-btn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:10px;color:var(--dim);padding:8px 16px;cursor:pointer;font-family:var(--font);font-size:.82rem;font-weight:500;transition:all .2s}
.hist-btn:hover{border-color:var(--neon);color:var(--neon)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:299;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(4px)}
.overlay.show{opacity:1;pointer-events:all}
.drawer{position:fixed;right:0;top:0;bottom:0;width:360px;z-index:300;background:rgba(8,14,32,.97);border-left:1px solid rgba(0,212,255,.1);transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.dh-title{font-weight:700;font-size:.95rem;background:linear-gradient(90deg,#fff,var(--neon));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.close-d{background:none;border:none;color:var(--dim);cursor:pointer;font-size:1rem;padding:4px}
.hist-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.hi{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.05);border-radius:11px;padding:12px 14px;cursor:pointer;transition:border-color .2s}
.hi:hover{border-color:rgba(0,212,255,.25)}
.hi-langs{font-size:.68rem;color:var(--dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hi-src{font-size:.82rem;color:var(--dim);margin-bottom:3px}
.hi-trl{font-size:.88rem;color:var(--txt);font-weight:500}
.hi-time{font-size:.68rem;color:rgba(90,122,154,.55);margin-top:6px}
.empty-s{color:var(--dim);font-size:.82rem;text-align:center;padding:28px}
</style>
</head>
<body>
<canvas id="bg-cv"></canvas>
<div class="grid"></div>
<nav>
  <div class="nb">
    <div class="nlogo"><div class="mwrap"><div class="mw"></div><div class="mw"></div><div class="mw"></div><div class="mw"></div><div class="mw"></div></div></div>
    <div class="ntitle">VoiceBridge</div>
  </div>
  <div class="nr">
    <div class="wspill" id="ws-pill"><div class="wsdot"></div><span id="ws-label">Offline</span></div>
    <div class="nusr" id="nav-user">—</div>
    <button class="lout" id="logout-btn">Sign Out</button>
  </div>
</nav>
<main>
  <div class="lbar">
    <div class="lsw">
      <label>Speak In</label>
      <select id="src-lang">
        <option value="auto">🔍 Auto Detect</option>
        <option value="en">English</option>
        <option value="ur">Urdu</option>
        <option value="ar">Arabic</option>
        <option value="zh">Chinese</option>
      </select>
    </div>
    <button class="swap-btn" id="swap-btn">⇄</button>
    <div class="lsw">
      <label>Translate To</label>
      <select id="tgt-lang">
        <option value="ur">Urdu</option>
        <option value="en">English</option>
        <option value="ar">Arabic</option>
        <option value="zh">Chinese</option>
      </select>
    </div>
  </div>
  <div class="panels">
    <div class="panel panel-in" id="in-panel">
      <div class="ph">
        <div class="ph-label"><div class="ph-dot"></div>Your Voice</div>
        <div class="viz">
          <div class="vbar" id="vb1"></div><div class="vbar" id="vb2"></div><div class="vbar" id="vb3"></div><div class="vbar" id="vb4"></div>
          <div class="vbar" id="vb5"></div><div class="vbar" id="vb6"></div><div class="vbar" id="vb7"></div><div class="vbar" id="vb8"></div>
        </div>
      </div>
      <div class="tbox" id="src-box"><span class="ph-txt">Click mic → speak → keeps accumulating…</span></div>
      <div class="panel-bottom">
        <div class="mic-wrap">
          <button class="mic-btn" id="mic-btn">
            <div class="mic-ring"></div><div class="mic-ring r2"></div>🎙️
          </button>
          <span class="mic-label" id="mic-label">Click to Start</span>
        </div>
      </div>
    </div>
    <div class="panel panel-out">
      <div class="ph">
        <div class="ph-label" style="color:var(--teal)"><div class="ph-dot" style="background:var(--teal);box-shadow:0 0 6px var(--teal)"></div>Translation</div>
        <span style="font-size:.7rem;color:var(--grn);font-weight:600">⚡ Live</span>
      </div>
      <div class="tbox" id="tgt-box"><span class="ph-txt">Translations accumulate here…</span></div>
      <div class="panel-bottom">
        <div class="out-btns">
          <button class="btn-replay" id="play-btn" disabled>▶ Replay</button>
          <button class="btn-clear" id="clear-btn">🗑 Clear</button>
          <button class="btn-copy" id="copy-btn">📋</button>
        </div>
      </div>
    </div>
  </div>
  <div class="status-row"><div class="ssp" id="ssp"></div><span id="st-txt">Ready — Click mic to start</span></div>
  <button class="hist-btn" id="hist-btn">📜 History</button>
</main>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer">
  <div class="dh"><span class="dh-title">History</span><button class="close-d" id="close-d">✕</button></div>
  <div class="hist-list" id="hist-list"><p class="empty-s">No translations yet.</p></div>
</aside>

<script>
const API="http://localhost:5000";
const tok=()=>localStorage.getItem("vb_token");
const usr=()=>localStorage.getItem("vb_user");
if(!tok())location.href="index.html";
document.getElementById("nav-user").textContent=usr()||"—";

/* Canvas bg */
(function(){
  const cv=document.getElementById("bg-cv"),cx=cv.getContext("2d");
  let W,H,pts=[];
  const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;init()};
  const init=()=>{pts=[];for(let i=0;i<45;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.2+.3,h:Math.random()>.5?195:275})};
  const draw=()=>{
    cx.clearRect(0,0,W,H);
    const g=cx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#06091a");g.addColorStop(.5,"#080c20");g.addColorStop(1,"#06091a");
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);cx.fillStyle=`hsla(${p.h},85%,68%,.45)`;cx.fill()});
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<95){cx.beginPath();cx.moveTo(pts[i].x,pts[i].y);cx.lineTo(pts[j].x,pts[j].y);cx.strokeStyle=`rgba(0,200,255,${(1-d/95)*.06})`;cx.lineWidth=.4;cx.stroke()}}
    requestAnimationFrame(draw);
  };
  window.addEventListener("resize",rs);rs();draw();
})();

const setSt=(t,s)=>{document.getElementById("st-txt").textContent=t;document.getElementById("ssp").classList.toggle("on",s)};

/* WebSocket */
let socket=null,wsOk=false;
function initSocket(){
  if(typeof io==="undefined")return;
 socket=io(API,{query:{token:tok()},transports:["polling","websocket"]});
  socket.on("connect",()=>{wsOk=true;setWs(true);setSt("Connected — Click mic to start",false)});
  socket.on("disconnect",()=>{wsOk=false;setWs(false)});
  socket.on("connect_error",()=>{wsOk=false;setWs(false)});
  socket.on("processing",d=>setSt(d.message,true));
  socket.on("translation_result",onResult);
  socket.on("silence",()=>{isBusy=false;if(isOn)setSt("🔴 Listening…",false)});
  socket.on("error",d=>{setSt("Error: "+d.message,false);isBusy=false});
  socket.on("connected",d=>setSt(d.message,false));
}
function setWs(on){document.getElementById("ws-pill").classList.toggle("on",on);document.getElementById("ws-label").textContent=on?"Live":"Offline";}
initSocket();

/* ── AUDIO QUEUE ── */
const audioQueue = [];
let isPlaying = false;
let lastB64 = null;
let audioCtxOut = null;

async function unlockAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;

    if (!AC) return;

    if (!audioCtxOut) {
      audioCtxOut = new AC();
    }

    if (audioCtxOut.state === "suspended") {
      await audioCtxOut.resume();
    }

    console.log("🔊 Audio ready:", audioCtxOut.state);

  } catch (e) {
    console.error("Audio unlock error:", e);
  }
}

function enqueueAudio(b64) {

  if (!b64) {
    console.warn("No audio received");
    return;
  }

  console.log("🔊 New translation audio received");

  lastB64 = b64;

  audioQueue.push(b64);

  if (!isPlaying) {
    playNext();
  }
}

async function playNext() {

  if (!audioQueue.length) {
    isPlaying = false;
    return;
  }

  isPlaying = true;

  const b64 = audioQueue.shift();

  try {

    await unlockAudio();

    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }

    const audioBuffer =
      await audioCtxOut.decodeAudioData(bytes.buffer);

    console.log(
      "🔊 Playing audio:",
      audioBuffer.duration.toFixed(2),
      "seconds"
    );

    const source = audioCtxOut.createBufferSource();

    source.buffer = audioBuffer;
    source.connect(audioCtxOut.destination);

    source.onended = () => {
      isPlaying = false;
      playNext();
    };

    source.start(0);

  } catch (err) {

    console.error("❌ Audio playback failed:", err);

    isPlaying = false;

    setTimeout(playNext, 100);
  }
}
function enqueueAudio(b64){
  lastB64=b64;
  audioQueue.push(b64);
  if(!isPlaying) playNext();
}

function playNext(){
  if(!audioQueue.length){isPlaying=false;return;}
  isPlaying=true;
  const b64=audioQueue.shift();
  const audio=new Audio();
  /* Try WAV first */
  audio.src="data:audio/wav;base64,"+b64;
  audio.onended=()=>playNext();
  audio.onerror=()=>{
    /* Fallback MP3 */
    const a2=new Audio("data:audio/mp3;base64,"+b64);
    a2.onended=()=>playNext();
    a2.onerror=()=>{isPlaying=false;playNext()};
    a2.play().catch(()=>{isPlaying=false;playNext()});
  };
  audio.play().catch(()=>{
    /* Fallback MP3 */
    const a2=new Audio("data:audio/mp3;base64,"+b64);
    a2.onended=()=>playNext();
    a2.onerror=()=>{isPlaying=false;playNext()};
    a2.play().catch(()=>{isPlaying=false;playNext()});
  });
}

/* State */
let isOn=false,stream=null,mediaRec=null,chunks=[],isBusy=false;
let audioCtx=null,analyser=null,lvlRaf=null;
let firstChunk=true;
const VBARS=["vb1","vb2","vb3","vb4","vb5","vb6","vb7","vb8"];

/* MIC CLICK */
document.getElementById("mic-btn").addEventListener("click",async()=>{
  if(!isOn) await startSession();
  else stopSession();
});

async function startSession(){
  try{
    await unlockAudio();
    stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
    isOn=true;firstChunk=true;isBusy=false;
    setMicUI(true);startViz(stream);recordChunk();
    setSt("🔴 Listening… speak now",false);
  }catch(e){setSt("❌ Mic access denied!",false)}
}

function stopSession(){
  isOn=false;
  setMicUI(false);stopViz();
  if(mediaRec&&mediaRec.state!=="inactive")mediaRec.stop();
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=null;mediaRec=null;chunks=[];isBusy=false;
  setSt("Stopped — Click mic to start again",false);
}

function recordChunk(){
  if(!isOn||!stream)return;
  chunks=[];
  try{
    mediaRec=new MediaRecorder(stream,{mimeType:"audio/webm;codecs=opus"});
    mediaRec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
    mediaRec.onstop=()=>processChunk();
    mediaRec.start();
    /* 3 second chunks */
    setTimeout(()=>{
      if(mediaRec&&mediaRec.state==="recording") mediaRec.stop();
    },6000);
  }catch(e){console.error(e)}
}

async function processChunk(){
  /* Start next chunk immediately */
  if(isOn) setTimeout(recordChunk,50);

  if(!chunks.length)return;
  const blob=new Blob(chunks,{type:"audio/webm"});
  /* Skip silence — less than 4KB */
  if(blob.size<4000)return;
  /* Skip if busy — don't wait, just drop this chunk */
  if(isBusy)return;

  isBusy=true;
  const buf=await blob.arrayBuffer();
  const b64=btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sl=document.getElementById("src-lang").value;
  const tl=document.getElementById("tgt-lang").value;
  setSt("⚡ Translating…",true);

  if(wsOk&&socket?.connected){
    socket.emit("translate_audio",{audio:b64,source_lang:sl,target_lang:tl});
  }else{
    try{
      const r=await fetch(`${API}/api/translate`,{method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+tok()},
        body:JSON.stringify({audio:b64,source_lang:sl,target_lang:tl})});
      const d=await r.json();
      if(r.ok)onResult(d);
      else setSt("Error: "+(d.error||"?"),false);
    }catch(e){setSt("Error: "+e.message,false);}
    isBusy=false;
  }
}

/* ── ON RESULT ── */
function onResult(d){
  isBusy=false;
  console.log("🔊 Audio data received:", !!d.audio_b64, d.audio_b64?.length);
  if(!d.source_text||!d.source_text.trim()){
    setSt(isOn?"🔴 Listening…":"Ready",false);return;
  }

  const srcBox=document.getElementById("src-box");
  const tgtBox=document.getElementById("tgt-box");

  /* Clear placeholder on first */
  if(firstChunk){srcBox.innerHTML="";tgtBox.innerHTML="";firstChunk=false;}

  /* Append source */
  const sc=document.createElement("div");
  sc.className="chunk";
  sc.innerHTML=`<div class="chunk-src">${esc(d.source_text)}</div>`;
  srcBox.appendChild(sc);
  srcBox.scrollTop=srcBox.scrollHeight;

  /* Append translation */
  const tc=document.createElement("div");
  tc.className="chunk";
  tc.innerHTML=`<div class="chunk-trl">${esc(d.translated)}</div>`;
  tgtBox.appendChild(tc);
  tgtBox.scrollTop=tgtBox.scrollHeight;

  /* Queue audio */
  if(d.audio_b64){
    document.getElementById("play-btn").disabled=false;
    enqueueAudio(d.audio_b64);
  }

  setSt(isOn?"🔴 Listening…":"✅ Done",false);
  loadHist();
}

/* Visualizer */
function startViz(s){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();analyser.fftSize=256;
    audioCtx.createMediaStreamSource(s).connect(analyser);
    const data=new Uint8Array(analyser.frequencyBinCount);
    const tick=()=>{
      analyser.getByteFrequencyData(data);
      const bins=Math.floor(data.length/VBARS.length);
      VBARS.forEach((id,i)=>{
        const el=document.getElementById(id);if(!el)return;
        const avg=data.slice(i*bins,(i+1)*bins).reduce((a,b)=>a+b,0)/bins;
        const h=Math.max(3,Math.min(20,avg*.22));
        el.style.height=h+"px";el.style.background=avg>50?"rgba(244,63,94,.9)":"rgba(0,212,255,.5)";
      });
      lvlRaf=requestAnimationFrame(tick);
    };tick();
  }catch(e){}
}
function stopViz(){
  cancelAnimationFrame(lvlRaf);
  if(audioCtx){audioCtx.close();audioCtx=null;}
  VBARS.forEach(id=>{const el=document.getElementById(id);if(el){el.style.height="3px";el.style.background="rgba(0,212,255,.2)";}});
}
function setMicUI(on){
  document.getElementById("mic-btn").classList.toggle("on",on);
  document.getElementById("in-panel").classList.toggle("on",on);
  const lbl=document.getElementById("mic-label");
  lbl.textContent=on?"🔴 Listening — Click to Stop":"Click to Start";
  lbl.classList.toggle("on",on);
}

/* Replay last */
document.getElementById("play-btn").addEventListener("click", async () => {
  if (!lastB64) return;

  await unlockAudio();
  enqueueAudio(lastB64);
});

/* Clear */
document.getElementById("clear-btn").addEventListener("click",()=>{
  document.getElementById("src-box").innerHTML='<span class="ph-txt">Click mic → speak…</span>';
  document.getElementById("tgt-box").innerHTML='<span class="ph-txt">Translations accumulate here…</span>';
  document.getElementById("play-btn").disabled=true;
  lastB64=null;firstChunk=true;
  audioQueue.length=0;isPlaying=false;
});

/* Copy */
document.getElementById("copy-btn").addEventListener("click",async()=>{
  const all=[...document.getElementById("tgt-box").querySelectorAll(".chunk-trl")].map(e=>e.textContent).join("\n");
  if(!all)return;
  await navigator.clipboard.writeText(all).catch(()=>{});
  const b=document.getElementById("copy-btn");b.textContent="✅";
  setTimeout(()=>b.textContent="📋",1500);
});

/* Swap */
document.getElementById("swap-btn").addEventListener("click",()=>{
  const s=document.getElementById("src-lang"),t=document.getElementById("tgt-lang");
  if(s.value==="auto")return;const tmp=s.value;s.value=t.value;t.value=tmp;
});

/* History */
const drawer=document.getElementById("drawer"),overlay=document.getElementById("overlay");
document.getElementById("hist-btn").addEventListener("click",()=>{drawer.classList.add("open");overlay.classList.add("show");loadHist()});
document.getElementById("close-d").addEventListener("click",()=>{drawer.classList.remove("open");overlay.classList.remove("show")});
overlay.addEventListener("click",()=>{drawer.classList.remove("open");overlay.classList.remove("show")});

async function loadHist(){
  try{
    const r=await fetch(`${API}/api/history`,{headers:{"Authorization":"Bearer "+tok()}});
    const data=await r.json();
    const list=document.getElementById("hist-list");list.innerHTML="";
    if(!data.length){list.innerHTML='<p class="empty-s">No translations yet.</p>';return}
    data.forEach(it=>{
      const d=document.createElement("div");d.className="hi";
      d.innerHTML=`<div class="hi-langs">${esc(it.source_lang||"?").toUpperCase()} → ${esc(it.target_lang||"?").toUpperCase()}</div>
        <div class="hi-src">${esc(it.source_text||"")}</div><div class="hi-trl">${esc(it.translated||"")}</div>
        <div class="hi-time">${new Date(it.created).toLocaleString()}</div>`;
      list.appendChild(d);
    });
  }catch(e){console.warn(e)}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* Logout */
document.getElementById("logout-btn").addEventListener("click",()=>{
  stopSession();if(socket)socket.disconnect();
  localStorage.removeItem("vb_token");localStorage.removeItem("vb_user");location.href="index.html";
});
</script>
